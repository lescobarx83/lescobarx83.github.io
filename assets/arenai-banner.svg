<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Main Frame -->
  <rect width="400" height="250" rx="20" fill="url(#bannerBg)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Neural Grid Background -->
  <circle cx="100" cy="80" r="4" fill="#6366f1" opacity="0.6"/>
  <circle cx="200" cy="60" r="5" fill="#a855f7" opacity="0.8"/>
  <circle cx="300" cy="90" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="150" cy="170" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="270" cy="160" r="4" fill="#6366f1" opacity="0.6"/>

  <line x1="100" y1="80" x2="200" y2="60" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="60" x2="300" y2="90" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="80" x2="150" y2="170" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="60" x2="270" y2="160" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="150" y1="170" x2="270" y2="160" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="90" x2="270" y2="160" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

  <!-- Main AI Brain / Game Controller Icon -->
  <g transform="translate(160, 80)">
    <rect x="0" y="0" width="80" height="50" rx="15" fill="none" stroke="url(#neonGrad)" stroke-width="4"/>
    <circle cx="25" cy="25" r="5" fill="#06b6d4"/>
    <circle cx="55" cy="20" r="4" fill="#a855f7"/>
    <circle cx="55" cy="30" r="4" fill="#6366f1"/>
  </g>

  <!-- Title Text -->
  <text x="200" y="185" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="22" letter-spacing="2">ArenAI</text>
  <text x="200" y="210" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-weight="600" font-size="12">Plataforma EdTech Socrática &amp; RPG</text>
</svg>
