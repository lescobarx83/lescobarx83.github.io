    <div id="root"></div>
    <aside id="arenai-test-accounts-bar" aria-label="Cuentas de prueba de ArenAI siempre disponibles">
      <button type="button" id="arenai-accounts-toggle" title="Mostrar u ocultar cuentas de prueba">🔑 Cuentas de Prueba</button>
      <span class="accounts-detail">
        🎓 Estudiante: <code>student</code>/<code>test</code> · <code>leo</code>/<code>ArenAI123</code> &nbsp;|&nbsp;
        🧬 Onboarding: <code>nuevo</code>/<code>ArenAI123</code> &nbsp;|&nbsp;
        👨‍🏫 Profesor: <code>professor</code>/<code>test</code> · <code>admin</code>/<code>ArenAIAdmin123</code>
      </span>
      <a href="../../index.html" id="arenai-back-link" style="display:none;">← Auditoría</a>
    </aside>
    <script>
      (function () {
        // Garantizar siempre la existencia de las 5 cuentas de prueba semilla en localStorage
        var DB_KEY = 'arenai_standalone_db_v1';
        var REQUIRED_USERS = [
          { id_user: 1, username: 'admin', email: 'admin@arenai.edu.cr', password_hash: 'ArenAIAdmin123', name: 'Leonardo', last_name: 'Escobar', phone_number: '8888-0000', id_institution: 1, institution_name: 'Liceo de Costa Rica', role: 'professor', first_login: false },
          { id_user: 888, username: 'professor', email: 'prof@test.com', password_hash: 'test', name: 'Test Professor', last_name: 'ArenAI', phone_number: '8888-1111', id_institution: 1, institution_name: 'Liceo de Costa Rica', role: 'professor', first_login: false },
          { id_user: 999, username: 'student', email: 'student@test.com', password_hash: 'test', name: 'Test Student', last_name: 'ArenAI', phone_number: null, id_institution: 1, institution_name: 'Liceo de Costa Rica', role: 'student', first_login: false },
          { id_user: 2, username: 'leo', email: 'leo@students.arenai', password_hash: 'ArenAI123', name: 'Leonardo Escobar', last_name: null, phone_number: null, id_institution: 1, institution_name: 'Liceo de Costa Rica', role: 'student', first_login: false },
          { id_user: 3, username: 'nuevo', email: 'nuevo@students.arenai', password_hash: 'ArenAI123', name: 'Estudiante Nuevo', last_name: null, phone_number: null, id_institution: 1, institution_name: 'Liceo de Costa Rica', role: 'student', first_login: true }
        ];
        try {
          var raw = localStorage.getItem(DB_KEY);
          if (raw) {
            var db = JSON.parse(raw);
            if (db && Array.isArray(db.users)) {
              REQUIRED_USERS.forEach(function (seedUser) {
                var exists = db.users.some(function (u) {
                  return String(u.username).toLowerCase() === seedUser.username;
                });
                if (!exists) {
                  db.users.push(seedUser);
                }
              });
              localStorage.setItem(DB_KEY, JSON.stringify(db));
            }
          }
        } catch (e) {}

        var bar = document.getElementById('arenai-test-accounts-bar');
        var toggleBtn = document.getElementById('arenai-accounts-toggle');
        var backLink = document.getElementById('arenai-back-link');
        if (window.self === window.top && backLink) {
          backLink.style.display = 'inline-block';
        }
        if (toggleBtn && bar) {
          toggleBtn.addEventListener('click', function () {
            bar.classList.toggle('is-collapsed');
          });
        }
      })();
    </script>
