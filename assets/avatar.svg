<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#avatarGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Outer Tech Ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2" stroke-dasharray="8 6" />
  <!-- Developer Head -->
  <circle cx="100" cy="78" r="32" fill="url(#avatarGrad)" />
  <!-- Developer Shoulders -->
  <path d="M 45 160 C 45 125, 70 120, 100 120 C 130 120, 155 125, 155 160 Z" fill="url(#avatarGrad)" opacity="0.9" />
  <!-- Code Symbol Accent -->
  <path d="M 85 75 L 75 80 L 85 85 M 115 75 L 125 80 L 115 85" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
